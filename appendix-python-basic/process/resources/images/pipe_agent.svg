<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="100%" height="100%">
  <defs>
    <!-- 箭头标记 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0066cc" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745" />
    </marker>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="850" fill="#f8f9fa" />

  <!-- ================= 主进程 (Main Agent) 泳道 ================= -->
  <rect x="50" y="50" width="220" height="750" fill="#e3f2fd" rx="10" stroke="#90caf9" stroke-width="2"/>
  <text x="160" y="80" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0d47a1" text-anchor="middle">主进程 (Main Agent)</text>

  <!-- ================= 子进程 1 (Sub Agent 1) 泳道 ================= -->
  <rect x="290" y="50" width="220" height="750" fill="#e8f5e9" rx="10" stroke="#a5d6a7" stroke-width="2"/>
  <text x="400" y="80" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b5e20" text-anchor="middle">子进程 1 (数据分析)</text>

  <!-- ================= 子进程 2 (Sub Agent 2) 泳道 ================= -->
  <rect x="530" y="50" width="220" height="750" fill="#fff3e0" rx="10" stroke="#ffcc80" stroke-width="2"/>
  <text x="640" y="80" font-family="sans-serif" font-size="18" font-weight="bold" fill="#e65100" text-anchor="middle">子进程 2 (网络搜索)</text>

  <!-- ================= 主进程节点 ================= -->
  <!-- 1. 主进程启动 -->
  <rect x="70" y="110" width="180" height="40" fill="#fff" rx="20" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="135" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">主 Agent 启动</text>

  <!-- 2. 创建 Pipe 和 Process -->
  <rect x="70" y="190" width="180" height="60" fill="#fff" rx="5" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="215" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">创建 2 个 Pipe</text>
  <text x="160" y="235" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">启动 2 个 Process</text>

  <!-- 3. 发送任务 -->
  <rect x="70" y="290" width="180" height="60" fill="#fff" rx="5" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="315" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">发送任务 1 (Pipe 1)</text>
  <text x="160" y="335" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">发送任务 2 (Pipe 2)</text>

  <!-- 4. 阻塞等待结果 -->
  <rect x="70" y="450" width="180" height="60" fill="#fff" rx="5" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="475" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d32f2f" text-anchor="middle">阻塞等待 (recv)</text>
  <text x="160" y="495" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">此时主进程挂起</text>

  <!-- 5. 接收结果并打印 -->
  <rect x="70" y="580" width="180" height="60" fill="#fff" rx="5" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="605" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">接收结果 1 &amp; 结果 2</text>
  <text x="160" y="625" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">打印日志</text>

  <!-- 6. 发送结束信号 -->
  <rect x="70" y="680" width="180" height="60" fill="#fff" rx="5" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="705" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">发送 None (结束信号)</text>
  <text x="160" y="725" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">Join &amp; Close</text>
  
  <!-- 7. 主进程结束 -->
  <rect x="70" y="770" width="180" height="30" fill="#1565c0" rx="15" filter="url(#shadow)"/>
  <text x="160" y="790" font-family="sans-serif" font-size="14" fill="#fff" text-anchor="middle">主 Agent 结束</text>


  <!-- ================= 子进程 1 节点 ================= -->
  <!-- 子进程 1 启动 -->
  <rect x="310" y="110" width="180" height="40" fill="#fff" rx="20" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="135" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">Sub Agent 1 启动</text>

  <!-- 子进程 1 接收任务 (循环) -->
  <rect x="310" y="190" width="180" height="60" fill="#fff" rx="5" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d32f2f" text-anchor="middle">阻塞等待任务 (recv)</text>
  <text x="400" y="235" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">收到任务: "分析销售数据"</text>

  <!-- 子进程 1 处理任务 -->
  <rect x="310" y="350" width="180" height="60" fill="#fff" rx="5" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="375" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">模拟耗时处理</text>
  <text x="400" y="395" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">time.sleep(3~7s)</text>

  <!-- 子进程 1 发送结果 -->
  <rect x="310" y="450" width="180" height="60" fill="#fff" rx="5" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="475" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">发送结果 (send)</text>
  <text x="400" y="495" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">传回给主进程</text>

  <!-- 子进程 1 收到结束信号 -->
  <rect x="310" y="680" width="180" height="60" fill="#fff" rx="5" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="705" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">收到 None</text>
  <text x="400" y="725" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">跳出 while 循环</text>

  <!-- 子进程 1 结束 -->
  <rect x="310" y="770" width="180" height="30" fill="#2e7d32" rx="15" filter="url(#shadow)"/>
  <text x="400" y="790" font-family="sans-serif" font-size="14" fill="#fff" text-anchor="middle">Sub Agent 1 结束</text>


  <!-- ================= 子进程 2 节点 ================= -->
  <!-- 子进程 2 启动 -->
  <rect x="550" y="110" width="180" height="40" fill="#fff" rx="20" stroke="#ef6c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="135" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">Sub Agent 2 启动</text>

  <!-- 子进程 2 接收任务 (循环) -->
  <rect x="550" y="190" width="180" height="60" fill="#fff" rx="5" stroke="#ef6c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d32f2f" text-anchor="middle">阻塞等待任务 (recv)</text>
  <text x="640" y="235" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">收到任务: "搜索 Python 特性"</text>

  <!-- 子进程 2 处理任务 -->
  <rect x="550" y="350" width="180" height="60" fill="#fff" rx="5" stroke="#ef6c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="375" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">模拟耗时处理</text>
  <text x="640" y="395" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">time.sleep(3~7s)</text>

  <!-- 子进程 2 发送结果 -->
  <rect x="550" y="450" width="180" height="60" fill="#fff" rx="5" stroke="#ef6c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="475" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">发送结果 (send)</text>
  <text x="640" y="495" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">传回给主进程</text>

  <!-- 子进程 2 收到结束信号 -->
  <rect x="550" y="680" width="180" height="60" fill="#fff" rx="5" stroke="#ef6c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="705" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">收到 None</text>
  <text x="640" y="725" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">跳出 while 循环</text>

  <!-- 子进程 2 结束 -->
  <rect x="550" y="770" width="180" height="30" fill="#ef6c00" rx="15" filter="url(#shadow)"/>
  <text x="640" y="790" font-family="sans-serif" font-size="14" fill="#fff" text-anchor="middle">Sub Agent 2 结束</text>


  <!-- ================= 连线与数据流向 ================= -->
  
  <!-- 主进程内部流转 -->
  <line x1="160" y1="150" x2="160" y2="190" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="160" y1="250" x2="160" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="160" y1="350" x2="160" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <line x1="160" y1="510" x2="160" y2="580" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="160" y1="640" x2="160" y2="680" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="160" y1="740" x2="160" y2="770" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 子进程 1 内部流转 (包含循环) -->
  <line x1="400" y1="150" x2="400" y2="190" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <!-- 循环箭头 -->
  <path d="M 310 220 L 290 220 L 290 510 L 310 510" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
  <text x="285" y="360" font-family="sans-serif" font-size="12" fill="#2e7d32" transform="rotate(-90 285 360)">for 循环</text>
  
  <line x1="400" y1="250" x2="400" y2="350" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="400" y1="410" x2="400" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <!-- 跳出循环 -->
  <line x1="490" y1="220" x2="520" y2="220" stroke="#555" stroke-width="2" />
  <line x1="520" y1="220" x2="520" y2="710" stroke="#555" stroke-width="2" />
  <line x1="520" y1="710" x2="490" y2="710" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <text x="510" y="450" font-family="sans-serif" font-size="12" fill="#666" transform="rotate(-90 510 450)">收到 None 跳出循环</text>
  <line x1="400" y1="740" x2="400" y2="770" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 子进程 2 内部流转 (包含循环) -->
  <line x1="640" y1="150" x2="640" y2="190" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <!-- 循环箭头 -->
  <path d="M 550 220 L 530 220 L 530 510 L 550 510" fill="none" stroke="#ef6c00" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
  
  <line x1="640" y1="250" x2="640" y2="350" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="410" x2="640" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <!-- 跳出循环 -->
  <line x1="730" y1="220" x2="760" y2="220" stroke="#555" stroke-width="2" />
  <line x1="760" y1="220" x2="760" y2="710" stroke="#555" stroke-width="2" />
  <line x1="760" y1="710" x2="730" y2="710" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <text x="750" y="450" font-family="sans-serif" font-size="12" fill="#666" transform="rotate(-90 750 450)">收到 None 跳出循环</text>
  <line x1="640" y1="740" x2="640" y2="770" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 跨进程通信连线 -->
  <!-- 主进程到 子进程 1 发送 -->
  <line x1="250" y1="310" x2="310" y2="210" stroke="#0066cc" stroke-width="3" marker-end="url(#arrow-blue)" />
  <rect x="230" y="270" width="70" height="20" fill="#e3f2fd" rx="4"/>
  <text x="265" y="285" font-family="sans-serif" font-size="12" fill="#0066cc" text-anchor="middle">Pipe 1</text>

  <!-- 主进程到 子进程 2 发送 -->
  <line x1="250" y1="330" x2="550" y2="210" stroke="#0066cc" stroke-width="3" marker-end="url(#arrow-blue)" />
  <rect x="380" y="300" width="70" height="20" fill="#e3f2fd" rx="4"/>
  <text x="415" y="315" font-family="sans-serif" font-size="12" fill="#0066cc" text-anchor="middle">Pipe 2</text>

  <!-- 子进程 1 发送结果回主进程 -->
  <line x1="310" y1="480" x2="250" y2="480" stroke="#28a745" stroke-width="3" marker-end="url(#arrow-green)" />
  
  <!-- 子进程 2 发送结果回主进程 -->
  <line x1="550" y1="490" x2="250" y2="490" stroke="#28a745" stroke-width="3" marker-end="url(#arrow-green)" />
  
  <!-- 时间线提示 -->
  <line x1="40" y1="100" x2="40" y2="810" stroke="#999" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="30" y="450" font-family="sans-serif" font-size="16" fill="#666" transform="rotate(-90 30 450)" text-anchor="middle">时间线 (Time)</text>

  <!-- 耗时标注 -->
  <rect x="320" y="410" width="60" height="25" fill="#ffcdd2" rx="4" stroke="#e57373"/>
  <text x="350" y="427" font-family="sans-serif" font-size="12" fill="#b71c1c" text-anchor="middle">耗时3~7s</text>
  
  <rect x="560" y="410" width="60" height="25" fill="#ffcdd2" rx="4" stroke="#e57373"/>
  <text x="590" y="427" font-family="sans-serif" font-size="12" fill="#b71c1c" text-anchor="middle">耗时3~7s</text>

</svg>